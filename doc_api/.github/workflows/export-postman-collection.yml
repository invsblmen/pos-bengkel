name: Export Postman Collection - SDMS

on:
  schedule:
    - cron: '0 0 * * *'  # Setiap hari pukul 00:00 UTC
  workflow_dispatch:       # Bisa dijalankan manual dari tab GitHub Actions
  push:
    branches:
      - main               # Trigger otomatis saat push ke branch main

jobs:
  export-collection:
    name: Export SDMS Collection from Postman
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export Postman Collection via API
        run: |
          mkdir -p postman
          curl --silent --fail \
            --header "X-Api-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            "https://api.getpostman.com/collections/ed4d6671-ee3a-4f00-beb7-ee403a882d63" \
            -o postman/SDMS_collection.json
          echo "✅ Collection SDMS berhasil diekspor"

      - name: Export Postman Environment
        run: |
          curl --silent \
            --header "X-Api-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            "https://api.getpostman.com/environments/a069cf15-b47f-4951-9cfe-a8b28a9c6480" \
            -o postman/SDMS_environment.json
          echo "✅ Environment berhasil diekspor"

      - name: Check if files changed
        id: check_changes
        run: |
          git diff --quiet postman/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add postman/
          git commit -m "chore: update SDMS Postman collection [$(date +'%Y-%m-%d %H:%M UTC')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "ℹ️ Tidak ada perubahan pada collection, skip commit."
