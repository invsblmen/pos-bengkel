openapi: "3.0.3"
info:
  title: "SDMS Dealer API — Autentikasi"
  version: "1.0.0"
  description: |
    Dokumentasi endpoint autentikasi untuk mendapatkan token Bearer.
    Gunakan endpoint ini untuk login dengan idInternal, username, dan password.
servers:
  - url: "https://sdmsdealer-h23.mpm-motor.com:22000/"
    description: "Base URL produksi"
  - url: "http://localhost:3000/"
    description: "Local proxy (run scripts/node/proxy/server.js and set TARGET_URL to production)"
  - url: "http://localhost:8000/"
    description: "Local Laravel server (use with Laravel proxy route /api/authenticate)"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthenticateRequest:
      type: object
      required: [idInternal, password, username]
      properties:
        idInternal:
          type: string
          description: "ID internal tenant/instansi"
          example: "C1002"
        password:
          type: string
          example: "pelitamotor0202"
        username:
          type: string
          example: "jajang.sukmana"
    AuthenticateResponse:
      type: object
      properties:
        access_token:
          type: string
          description: "Token akses Bearer"
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
        refresh_token:
          type: string
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PkbItem:
      type: object
      properties:
        noPkb:
          type: string
          description: "Nomor PKB"
        customerName:
          type: string
        vehicle:
          type: string
        status:
          type: string
      example:
        noPkb: "PKB-2026-0001"
        customerName: "Budi Santoso"
        vehicle: "Honda Vario 150"
        status: "OPEN"
    PkbResponse:
      type: array
      items:
        $ref: '#/components/schemas/PkbItem'
  parameters:
    UsernameHeader:
      name: username
      in: header
      description: "Username pemanggil (jika diperlukan oleh endpoint)"
      required: true
      schema:
        type: string
    IdInternalHeader:
      name: idInternal
      in: header
      description: "ID internal tenant/instansi"
      required: true
      schema:
        type: string
paths:
  /api/authenticate:
    post:
      tags: ["Auth"]
      summary: "Autentikasi — dapatkan Bearer token"
      description: "Endpoint untuk menerima kredensial dan mengembalikan token akses."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticateRequest"
            example:
              idInternal: "C1002"
              password: "pelitamotor0202"
              username: "jajang.sukmana"
      responses:
        '200':
          description: "Token diterbitkan"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticateResponse"
              examples:
                success:
                  value:
                    access_token: "eyJhbGciOi..."
                    token_type: "Bearer"
                    expires_in: 3600
                    refresh_token: "..."
        '400':
          description: "Bad request / validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid:
                  value:
                    message: "Invalid credentials"
                    errors:
                      username: ["Username is required"]
        '401':
          description: "Unauthorized — credentials invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    message: "Unauthorized"
  /api/reception/Pkb:
    get:
      tags: ["Reception"]
      summary: "List PKB"
      description: "Ambil daftar PKB untuk tenant. Membutuhkan header `username`, `idInternal`, dan Authorization Bearer token."
      parameters:
        - $ref: "#/components/parameters/UsernameHeader"
        - $ref: "#/components/parameters/IdInternalHeader"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Daftar PKB berhasil diambil"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PkbResponse"
              examples:
                example:
                  value:
                    - noPkb: "PKB-2026-0001"
                      customerName: "Budi Santoso"
                      vehicle: "Honda Vario 150"
                      status: "OPEN"
                    - noPkb: "PKB-2026-0002"
                      customerName: "Siti Aminah"
                      vehicle: "Yamaha NMax"
                      status: "CLOSED"
        '401':
          description: "Unauthorized — token invalid atau header tidak lengkap"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    message: "Unauthorized or missing headers"
